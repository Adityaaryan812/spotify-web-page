<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify Link App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🎵 Spotify Link App</h1>

            <p class="subtitle">
                Paste a Spotify track link to view its details
            </p>

            <div class="input-box">
                <input
                    type="text"
                    id="spotifyUrl"
                    placeholder="Paste Spotify link here..."
                >

                <button onclick="getSpotifyInfo()">
                    Get Details
                </button>
            </div>

            <p id="error"></p>

            <div id="result" class="result hidden">

                <img id="cover" src="" alt="Spotify Cover">

                <h2 id="title"></h2>

                <p id="description"></p>

                <a
                    id="openSpotify"
                    href="#"
                    target="_blank"
                >
                    Open in Spotify
                </a>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
